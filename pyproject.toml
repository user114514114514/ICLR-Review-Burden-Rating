[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iclr-review-burden"
version = "1.0.0"
description = "Local ICLR review-burden scores, rankings, and a read-only query UI"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
iclr-burden = "iclr_burden.cli:main"

[tool.setuptools.packages.find]
include = ["iclr_burden*"]
